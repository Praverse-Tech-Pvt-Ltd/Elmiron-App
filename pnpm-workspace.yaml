nodeLinker: hoisted
storeDir: .pnpm-store

packages:
  - 'packages/*'
  - 'apps/*'
  - 'services/*'

# esbuild is vitest's bundler; it needs its postinstall to fetch the platform binary.
allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@supabase/auth-js@2.117.0'
  - '@supabase/functions-js@2.117.0'
  - '@supabase/postgrest-js@2.117.0'
  - '@supabase/realtime-js@2.117.0'
  - '@supabase/storage-js@2.117.0'
  - '@supabase/supabase-js@2.117.0'
