name: CI

on:
  pull_request:
  push:
    branches: [main]
  # W1-B A3 -- a workflow nobody can trigger by hand is one nobody can re-run after a flake,
  # and it is also the fastest way to tell "CI is broken" apart from "CI was never asked".
  #
  # This session lost time to exactly that distinction. Four pushed commits produced NO run,
  # and with only the two triggers above there was no way to ask for one: `pull_request` fires
  # against `refs/pull/N/merge`, and **GitHub cannot build that ref while the PR conflicts with
  # its base**, so a conflicting PR silently stops producing runs. It looks identical to a
  # disabled workflow, a billing stop or a permissions problem, and none of those was true.
  # `gh workflow run CI --ref <branch>` now distinguishes them in one command.
  workflow_dispatch:

# MR-41 B1 -- `set -o pipefail`, as a mechanism rather than a reminder.
#
# GitHub's default for `run:` is `bash -e {0}`, which has NO pipefail: in `a | b`, the step's
# exit status is `b`'s, so a failing `a` is invisible. `shell: bash` is
# `bash --noprofile --norc -eo pipefail {0}`, which is the same shell WITH it.
#
# This is not hypothetical here. `ci.yml` pipes `git diff | awk` to compute the count the
# append-only guard fails on, and `backup.yml` pipes `ls | head -1` to choose the artefact it
# verifies. A guard whose input command failed silently reports the empty answer as the safe
# one -- the `0 deletions` case and the `no artefact` case both look like success.
#
# It has cost two sessions already, on gradle and then on supabase, and the second was hit by
# the person who had written the entry about the first.
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Turbo prints enough without the interactive TUI in CI.
  TURBO_UI: 'false'

jobs:
  static:
    name: typecheck · lint · format · unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The append-only guard below diffs against the base, so it needs history.
          fetch-depth: 0

      # PROJECT-OVERVIEW.md is append-only and some of its sections are frozen. That
      # rule lived only as prose inside the file it protects, and a `prettier --write`
      # walked through it and reformatted a frozen table. A human caught it, which is
      # not a control. This is the control: any deletion from the file fails the build.
      - name: PROJECT-OVERVIEW.md is append-only
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            # Push events: compare against what the branch was before this push.
            # `origin/main...HEAD` is empty once the push has landed and would pass
            # vacuously, which is the failure mode this guard exists to avoid.
            BASE="${{ github.event.before }}"
          fi
          echo "Comparing $BASE...HEAD"
          DELETED=$(git diff --numstat "$BASE...HEAD" -- PROJECT-OVERVIEW.md | awk '{print $2}')
          DELETED=${DELETED:-0}
          echo "Deleted lines: $DELETED"
          if [ "$DELETED" -gt 0 ]; then
            echo "::error file=PROJECT-OVERVIEW.md::$DELETED line(s) removed. This file is append-only; frozen sections are never edited. Add a correction section instead."
            git diff "$BASE...HEAD" -- PROJECT-OVERVIEW.md | grep '^-[^-]' | head -40
            exit 1
          fi

      # W1-Q C. The id rule was a paragraph in CLAUDE.md three times, and ids collided three
      # times (C20; CR-5; FE-CR-1). This is the rule as a check: every BE-/FE- id has one row in
      # docs/ids.md, minted by its own track, cited only after it is registered, and never
      # changed once it is in the base. Same base as the guard above, for the same reason.
      - name: Every BE-/FE- id is registered once and never reused
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
          fi
          node scripts/check-ids.mjs "$BASE"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Every one of these fails the build. None of them warn.
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format:check

      # MR-27 A1. Every migration has a rollback FILE. No database, no destruction.
      #
      # The pairing check lived only inside `verify:rollbacks`, which EXECUTES every
      # rollback and empties the public schema -- so it is in the `database` job, it needs
      # Docker, and it is not what anybody runs locally. Migrations reached `main` with no
      # rollback twice (MR-24, MR-26) and both pushes failed on a step nothing local had run.
      #
      # MR-26 A4 made `ci:local` print loudly what it was skipping. That helped and was not
      # enough: the warning prints at the END OF A RUN and the moment that matters is when
      # somebody ADDS A MIGRATION. It was read in MR-26 Part A, two migrations were added in
      # Part B, and the push failed again.
      #
      # So the half that needs no database runs HERE, in the fast job -- which also means it
      # runs in the default `pnpm ci:local`, because `scripts/ci-local.mjs` derives its steps
      # from this file rather than duplicating them. `verify:rollbacks` in the database job
      # below still EXECUTES them, because a rollback that has never run is a claim.
      - name: Every migration has a rollback file
        run: node services/api/scripts/verify-rollbacks.mjs --files-only
      # W1-W D. The Edge Function loads its packages from `deno.json`; every test loads them from
      # `pnpm-lock.yaml`. The day those two name different versions, the tests prove a dependency
      # the deployed function does not run. Exact, and equal, or the build fails.
      - name: The Edge Function runs the dependency versions the tests run
        run: node services/api/scripts/check-function-pins.mjs
      # W2-A A (`BE-C70`). C30 once guaranteed by ABSENCE that the service-role key could not be
      # reached for in a hurry; BE-C69 spent that. This is what replaces it: exactly one read, in
      # `_shared/practice-writer.ts`, which can call two functions and exports nothing else.
      - name: The service-role key is read in exactly one place
        run: node services/api/scripts/check-service-role-reads.mjs
      - run: pnpm turbo run test --filter @fieldforce/core
      # The WCAG contrast guard. It fails the build when a design token drops below
      # its required ratio, and it had never run here — the step simply did not
      # exist, so the control was decorative in CI from the day it was written.
      - run: pnpm turbo run test --filter @fieldforce/ui-tokens
      # Added with this package's first real tests, in the same commit, because a
      # workspace that gains a suite and not a CI line is how ui-tokens stayed
      # decorative. Runs both runners: vitest for the boundary check, jest for
      # component rendering.
      - run: pnpm turbo run test --filter @fieldforce/ui
      # Contract I2: proves every mock response still parses against packages/core.
      - run: pnpm turbo run test --filter @fieldforce/mock
      # Two runners in one workspace, both invoked by this script: vitest for logic
      # (*.test.ts) and jest-expo for rendering (*.test.tsx). src/runner-boundary
      # asserts the two globs cannot overlap. Neither needs a device or a native
      # build; if this step ever starts wanting one, the approach is wrong.
      - run: pnpm turbo run test --filter @fieldforce/field
      # MR-08 A2. This workspace has had a `test` script and ten passing cases for
      # several sessions and **no step here at all**, so they had never run in CI and
      # appeared in no session's counts. Found by `scripts/test-counts.mjs`, which was
      # written to catch a workspace contributing zero and caught a workspace
      # contributing nothing instead. `ci-covers-every-suite.spec.ts` now derives this
      # list from the workspaces rather than trusting it to be kept up to date.
      - run: pnpm turbo run test --filter @fieldforce/console

  database:
    name: migrations · Gate 0 RLS suite · rollbacks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # W1-B C5 -- BUILD `@fieldforce/core` BEFORE `supabase start`, not before `functions serve`.
      #
      # This step exists because putting the build in the serve step was WRONG and CI said so:
      #
      #   failed to read file: open packages/core/dist/field/gateway/providers.js:
      #   no such file or directory
      #
      # `supabase start` does not just start containers -- it RESOLVES THE EDGE FUNCTIONS' IMPORT
      # GRAPH as it brings the edge runtime up. `supabase/functions/_shared/core.ts` imports
      # `packages/core/dist`, which is gitignored, and `pnpm run build` runs in the OTHER job. So
      # the database job reached `supabase start` with no `dist` and the whole job died before a
      # single migration test ran.
      #
      # It passed locally only because `dist` was already there from an earlier build -- the exact
      # shape of "a command that exits 0 is not a command that worked".
      #
      # Only `@fieldforce/core` is built, not the whole graph: it is the one thing the functions
      # import, and the static job already builds everything else.
      - name: Build @fieldforce/core, which the Edge Function imports
        run: pnpm --filter @fieldforce/core build

      # Proves every migration applies to an empty database, in order.
      # auth is required: the Gate 0 suite signs a fixture user in through GoTrue
      # to prove the hand-built JWT claims match the ones the auth hook really mints.
      - name: Start Supabase and apply migrations
        run: pnpm exec supabase --workdir services/api start -x realtime,vector,imgproxy,studio

      # BE-W92. `log_lock_waits` names the relation a session waited on, which is the
      # first thing that item's verification order asks for and the one thing a
      # single unreproduced deadlock did not leave behind.
      #
      # NOT a migration, and it was written as one first: `log_lock_waits` is a SUSET
      # parameter and the `postgres` role every migration runs as is not a superuser,
      # so `supabase db push` failed with "permission denied to set parameter". The
      # script connects as `supabase_admin`, which nothing else here does and nothing
      # else here should.
      #
      # BEFORE the suites, because `ALTER DATABASE` applies to sessions opened
      # afterwards -- running it after the tests would set it for nobody and
      # `lock-wait-logging.spec.ts` would fail saying so.
      - name: Log lock waits, so a deadlock names its relations
        run: node services/api/scripts/enable-lock-logging.mjs

      # W1-B C5 -- CI must actually RUN the Edge Function, or `ai-gateway.spec.ts` skips itself
      # and a green run means nothing about the gateway.
      #
      # THE BUILD IS NOT IN THIS STEP, and that is the corrected version of this comment.
      # `packages/core` is built in its own step ABOVE, before `supabase start`, because
      # `supabase start` resolves the functions' imports itself -- see that step. What remains true,
      # and was established by a mutation that failed to fail: `functions serve` hot-reloads the
      # FUNCTION directory; it does NOT
      # reload `packages/core/dist`, which the function imports from outside that directory. With
      # the server already running, W1-B rebuilt core with the patient guardrail deliberately
      # removed, re-ran the suite, and got NINE PASSES -- the server was still executing the old
      # bundle. Restarting it turned the same mutant into two failures, which is the result that
      # proved the test was real.
      #
      # So: BUILD, then SERVE. A build after a serve is invisible, and the symptom is the worst
      # one available -- a suite that passes while testing code that is no longer in the tree.
      # Registered as `BE-W119`.
      #
      # The wait loop is not a sleep. `supabase functions serve` prints its banner before the
      # runtime can answer, so a fixed sleep either wastes CI time or races; polling until the
      # function returns ANY status code -- 401 from the no-token path is a perfectly good
      # "something is listening" -- fails fast and explains itself if it never does.
      - name: Serve the AI gateway Edge Function
        run: |
          pnpm exec supabase --workdir services/api functions serve --no-verify-jwt &
          # W1-K: the readiness condition is 401-or-400, NOT "any answer that is not 000".
          #
          # **The previous condition passed on 502, and 502 means the function is DOWN.** Kong is
          # listening on :54321 from the moment `supabase start` finishes, so it answers 502 or 503
          # for a function whose runtime has not come up — a non-000 code that means the opposite of
          # ready. This step printed `ai-gateway answered HTTP 502`, exited 0, and 35 tests in the
          # four gateway suites then failed with `503 name resolution failed`, looking exactly like a
          # code regression.
          #
          # 401 (no bearer token) or 400 (bad body) is the FUNCTION refusing, which is the function
          # running. Those are the only two codes that prove the runtime is up.
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST               http://127.0.0.1:54321/functions/v1/ai-gateway               -H 'content-type: application/json' -d '{}' || true)
            if [ "$code" = "401" ] || [ "$code" = "400" ]; then
              echo "ai-gateway answered HTTP $code — the function is serving"
              exit 0
            fi
            echo "waiting for ai-gateway (last HTTP $code)"
            sleep 2
          done
          echo "FAILED: the ai-gateway function never answered 401/400 on :54321" >&2
          exit 1

      # Includes services/api/tests/rls.spec.ts — the Gate 0 adversarial suite.
      # SUPABASE_DB_URL being set does not make the tests run; db.ts hard-fails in CI
      # if the database is unreachable, so a green run always means they executed.
      - name: Database and Gate 0 tests
        env:
          CI: 'true'
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          SUPABASE_URL: http://127.0.0.1:54321
        # Through turbo, not `pnpm --filter ... test` directly. `turbo.json` declares
        # `test: { dependsOn: ["^build"] }`, so the dependency graph builds
        # `@fieldforce/core` for us. FIX-07 fixed this with a hand-added build step,
        # which worked and preserved the problem: an ordering somebody has to remember,
        # in a repo whose own rule is that a control invoked by a hand-maintained list
        # will eventually be left off it.
        #
        # `--force` because this suite talks to a real database. A turbo cache hit would
        # replay a previous pass without running anything, which would silently defeat
        # the guarantee below -- `db.ts` can only hard-fail on an unreachable database if
        # the tests actually execute.
        run: pnpm turbo run test --filter @fieldforce/api --force

      # ----------------------------------------------------------------------
      # W1-G D1/D2 -- THE BROWSER SUITE RUNS HERE, not only on one laptop.
      #
      # Why it must run in CI at all. `apps/console/e2e` was kept out of `turbo run test` because
      # CI had no browser, and that was right -- a suite that cannot run is worse than one that is
      # not wired up. But LOCAL-ONLY is how this repository loses checks: the graph rotted, the
      # pre-push hook never fired from a worktree, and `verify-clean-db` had to be run by hand.
      # Three instances of the same failure. A check only one machine can run is a check that
      # stops being run.
      #
      # It lives in the DATABASE job because it needs the whole stack: Postgres, PostgREST and
      # GoTrue are already up here, and the suite signs real people in through the real sign-in
      # form. The static job has none of that.
      #
      # It is NOT in `turbo run test`, still, and deliberately: `turbo.json` would then demand a
      # browser in every context that runs tests, including a developer's laptop mid-edit.
      # ----------------------------------------------------------------------
      - name: Install Chromium for the console browser suite
        run: pnpm --filter @fieldforce/console exec playwright install --with-deps chromium

      # THIS JOB BUILDS ONLY `@fieldforce/core`, by design — the step above says so, and says the
      # static job builds everything else. The console needs `@fieldforce/ui-tokens` too, and the
      # first attempt at this discovered that the hard way: `next build` failed with
      # `Can't resolve '@fieldforce/ui-tokens'` on six files, reported to Playwright only as
      # `Process from config.webServer was not able to start. Exit code: 1`.
      #
      # `--filter @fieldforce/console` with turbo's `build: { dependsOn: ["^build"] }` builds the
      # workspace dependencies first and the console last. It is a NAMED step so the next failure
      # of this kind names itself.
      - name: Build the console and the workspace packages it imports
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
        run: pnpm turbo run build --filter @fieldforce/console

      - name: Browser suite — the console, in a real browser
        env:
          CI: 'true'
          # `next start` reads these from the environment. The publishable key is public by design:
          # every row it can reach is decided by the signed-in user's JWT and the RLS policies.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
        # The stale report is DELETED before the run. Without this the proof step below can read a
        # report from an earlier run and pass — which it did, reporting 5 tests for a run that had
        # just passed 7. The reporter's output path is declared in `playwright.config.ts`.
        run: |
          rm -f apps/console/playwright-results.json
          pnpm --filter @fieldforce/console test:e2e

      # W1-G D2 -- PROVE IT RAN, the way the serve step proves the function is live.
      #
      # A green Playwright step and a Playwright step that executed tests are different claims.
      # `playwright test` exits 0 when it matches NO test files at all -- a renamed directory, a
      # bad `testDir`, a `grep` left in the config -- and the job would go green having checked
      # nothing. This reads the run's own report and fails if fewer than five tests were expected
      # or any were skipped, and it PRINTS the number so a human reading the log sees it.
      # The floor rises when specs are added; it is a floor, not an exact count, so adding a test
      # never fails the build and DELETING the suite always does.
      - name: Prove the browser suite actually executed
        run: |
          f=apps/console/playwright-results.json
          test -f "$f" || { echo "FAILED: $f does not exist, so the browser suite produced no report" >&2; exit 1; }
          # An absolute path: `require('./x')` resolves relative to the module, and for `node -e`
          # that is the CWD -- which is easy to get wrong when a step's CWD changes.
          expected=$(node -e "const r=require(process.argv[1]);console.log(r.stats.expected)" "$PWD/$f")
          skipped=$(node -e "const r=require(process.argv[1]);console.log(r.stats.skipped)" "$PWD/$f")
          unexpected=$(node -e "const r=require(process.argv[1]);console.log(r.stats.unexpected)" "$PWD/$f")
          echo "browser suite: $expected passed, $skipped skipped, $unexpected failed"
          if [ "$expected" -lt 7 ] || [ "$skipped" -ne 0 ] || [ "$unexpected" -ne 0 ]; then
            echo "FAILED: expected at least 7 passing browser tests and no skips." >&2
            exit 1
          fi

      - name: Keep the browser suite's traces when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/console/test-results/
          retention-days: 7

      # BE-W21. `ucpmp_sample_cap_quantity` is null on purpose -- nothing in this
      # repository states the UCPMP ceiling, and a constraint built on an invented
      # number looks enforced while being wrong invisibly. The cost of that honesty is
      # that the cap trigger is inert until somebody with authority answers, and
      # nothing was making anybody answer.
      #
      # This is what makes them. It fails once the deadline in
      # `ucpmp_sample_cap_decision_due` passes with the cap still unset, and it lives
      # HERE rather than in the test suite on purpose: a calendar-sensitive unit test
      # would break `pnpm test` for a developer who owns none of this, at which point
      # it gets skipped and stops being a control. `decision-debt.spec.ts` tests the
      # mechanism against a backdated row instead, so the suite never depends on today.
      #
      # BEFORE `verify:rollbacks`, and this is load-bearing rather than tidy. FIX-10 put
      # it after, where the schema has just been rolled back to empty, and the step
      # failed with `function public.ucpmp_cap_decision_status() does not exist` on run
      # 34150819478. The control was correct -- it failed CLOSED, which is what it was
      # designed to do when it cannot read an answer -- and the ordering was wrong.
      # Anything that reads the schema has to run before the step that destroys it.
      #
      # If this step is red: do NOT invent a cap value to clear it. Either set the real
      # one, or file a migration moving the deadline with the reason in its note.
      - name: No decision is past its deadline
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pnpm --filter @fieldforce/api check:decision-debt

      # Destructive, so it runs last. A rollback file that has never been executed
      # is a claim, not a rollback.
      - name: Verify every migration can be rolled back
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        # A script rather than a turbo task, so it stays a direct invocation. Its
        # workspace dependency is already built by the test step above, and
        # `verify-rollbacks.mjs` imports nothing from `packages/core` by design -- see
        # the scripts convention enforced in `rls.spec.ts`.
        run: pnpm --filter @fieldforce/api verify:rollbacks

      - name: Stop Supabase
        if: always()
        run: pnpm exec supabase --workdir services/api stop --no-backup
