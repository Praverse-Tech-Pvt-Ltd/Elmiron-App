name: Audio retention watchdog

# `audio_purge_health()` has existed since BE-W6 so that a stopped purge would be
# visible rather than inferred. Nothing called it, which made it a row nobody reads.
# This is the thing that calls it.
#
# It is a SEPARATE WORKFLOW from retention.yml on purpose. A watchdog that shares a
# job with the process it watches dies with it and reports nothing — the failure it
# is most needed for is exactly the one it would miss.
#
# The destination is a failed GitHub Actions run, which mails whoever is watching the
# repository. That is crude. It is also real, and it is available now, whereas the
# console that would display this is Frontend's week 11. When the console exists this
# should point at it instead.
#
# This is the OUTER of three layers, and the only one that reaches a person:
#
#   1. begin_upload refuses new audio when objects are past their purge date. In the
#      database, on the write path, cannot be switched off. Nobody is told.
#   2. audio_purge_health() reports the state to anything that asks.
#   3. This, which asks, and fails loudly when the answer is bad.

on:
  schedule:
    # BE-W8: retention.yml moved from daily to hourly (Part 3.1 -- see that file).
    # The watchdog moves with it, on a 15-minute offset so it checks after the
    # purge for that hour should already have completed.
    - cron: '15 * * * *'
  workflow_dispatch:

# MR-41 B1 -- `set -o pipefail`, as a mechanism rather than a reminder.
#
# GitHub's default for `run:` is `bash -e {0}`, which has NO pipefail: in `a | b`, the step's
# exit status is `b`'s, so a failing `a` is invisible. `shell: bash` is
# `bash --noprofile --norc -eo pipefail {0}`, which is the same shell WITH it.
#
# This is not hypothetical here. `ci.yml` pipes `git diff | awk` to compute the count the
# append-only guard fails on, and `backup.yml` pipes `ls | head -1` to choose the artefact it
# verifies. A guard whose input command failed silently reports the empty answer as the safe
# one -- the `0 deletions` case and the `no artefact` case both look like success.
#
# It has cost two sessions already, on gradle and then on supabase, and the second was hit by
# the person who had written the entry about the first.
defaults:
  run:
    shell: bash

concurrency:
  group: audio-retention-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    name: is anything actually destroying expired audio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Same reasoning as retention.yml: an unconfigured target is a real finding,
      # not a reason to skip. The retention promise is not being kept by anything
      # until this is pointed at a database.
      - name: Check the retention target is configured
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::The retention watchdog is not pointed at any database."
            echo "::error::Set the SUPABASE_DB_URL repository secret."
            exit 1
          fi
          echo "Watchdog target configured."

      - name: Check audio retention health
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          # MR-42 B1 / `BE-W103`. This script now refuses a non-local target unless it
          # is opted into. This is the deliberate opt-in:
          # it lives in a reviewed file, whereas a shell that inherited a stale
          # SUPABASE_DB_URL does not have it, which is the accident the guard is for.
          ELMIRON_ALLOW_REMOTE_TARGET: '1'
          # BE-W8 addendum: deliberately loose and DECOUPLED from the database's
          # own stall check (public.audio_purge_is_stalled(), backlog-size-based).
          # This is a secondary "has the worker gone completely silent" signal --
          # see check-purge-health.mjs and 20260817000200_purge_backlog_stall_detection.sql.
          PURGE_RUN_SILENCE_HOURS: '12'
        run: pnpm --filter @fieldforce/api check:purge-health
