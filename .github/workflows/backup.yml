name: Database backup

# ## 10 October 2026 (`BE-C80`): NOT THE PRODUCTION BACKUP ROUTE. Read this first.
#
# **Q-19 is answered: production's backup is Supabase's own managed (scheduled) backup**, on the
# paid plan. Deploy step 0.1 (`docs/DEPLOY-RUNBOOK.md`) checks that a completed Supabase backup
# dated today exists; it does not run this workflow, and the GitHub artefact this job would make is
# NOT required for the pilot deployment.
#
# So the weekly schedule is REMOVED and the dated deferral below with it. The deferral existed to
# keep an unanswered decision visible (the three-state design described next); the decision has
# been answered, so a reminder would be a red build about nothing -- exactly the noise this header
# warns against. Extending the date instead would have kept a false alarm on a timer.
#
# What is KEPT, and why: `workflow_dispatch`, with the destination check first. It is still the
# only route to an off-platform copy (`backup-database.mjs` + `verify-backup.mjs`, which also
# prove a dump restores), and it still refuses to produce anything until a destination exists and
# a step stores the copy there (`BE-W143`). Run by hand it now ends green with a notice saying
# that, never red. The history below is kept as it was written.
#
# `BE-W11`. MR-32 executed docs/restore-runbook.md for the first time and found its step 2 was
# the single word "Restore." — no PITR (declined), no dump, no schedule, no off-machine copy.
# MR-33 built the producer and the verifier. This is the schedule.
#
# **IT STILL REFUSES TO PRODUCE ANYTHING UNTIL A DESTINATION EXISTS.** That has not changed and
# is not negotiable: a dump of this database is not a file, it is a package of personal data —
# `doctors.full_name`, `user_profiles`, `transcripts_redacted`, every row of `auth.users`, and
# `adverse_event_reports.reported_text`, whose lawful contents are **open question 4.1**. Where
# it may land is a data-processing decision. The destination check runs FIRST, before anything
# is produced, so a run with no destination leaves no artefact anywhere — not even for the
# lifetime of a runner.
#
# ## What MR-34 D1 changed, and why it reverses MR-33
#
# MR-33 wrote: *"Keep this schedule live and red. The daily failure is the reminder that the
# recovery posture does not exist."* **That was wrong, and this repository has the receipt.**
#
# **A red that is correct every day is indistinguishable from a red that is broken.** The
# retention workflows went red, were disabled on **23 August** (`b5d03a5`, *"retention workflows
# disabled again"*), and `docs/COMPLETION-PLAN.md:602` still asks *"Why were the retention
# workflows disabled on 23 August?"* — **the reason was never recorded.** In the silence that
# followed, production auto-paused from **23 August to 7 September** and was found by a failed
# connection rather than by an alert. A daily alarm nobody can act on does not stay an alarm; it
# becomes noise, then it becomes disabled, and then it becomes silence.
#
# So this is structured the way `check:decision-debt` structures the UCPMP cap — **three states,
# not two**, with the deferral as a dated, attributable record rather than an absence:
#
# | State | Outcome | What a human sees |
# | --- | --- | --- |
# | destination configured | runs, produces, and proves by restoring | a normal green run |
# | no destination, **deferral live** | **green, with a `::notice::` naming the decision** | a run that says "deliberately disabled, waiting on X, re-enable when Y" |
# | no destination, **deferral EXPIRED** | **red, with `::error::`** | a failure that means the deferral lapsed, not that the backup broke |
#
# **The disabled state is a RUN, not an absence.** That is the whole point. A disabled workflow
# produces no runs, and no runs is exactly what 23 August looked like. This one keeps showing up
# and keeps saying what it is waiting for.
#
# ## The re-enable trigger, named
#
# **The operator's answer to Q-19, then a step that stores the copy there.** W1-W (`BE-W143`): this
# said "set the secret, no code change required" — FALSE. The secret is only tested for emptiness;
# nothing reads its value, and no step uploads the artefact, so with it set this job would produce
# and verify a dump that the runner then discards. The options and their costs are in
# `docs/operator-inputs.md` section 8 and `docs/blocked-on-you.md` → 6.3.
#
# ## The deferral, dated -- RETIRED 10 October (`BE-C80`), kept as history
#
# `DEFERRAL_EXPIRES` was **2026-10-15**, thirty days from the MR-34 session that set it.
# When it passes, this workflow goes red every week until somebody either configures a
# destination or files a new deferral **with a reason**, in this file, in a commit with an
# author and a date. That is deliberately the same escape hatch as the UCPMP deadline: possible,
# and impossible to do silently.

on:
  # BE-C80 (10 October): no schedule. It was `25 2 * * 1` (weekly), as a reminder of an unanswered
  # decision; Q-19 is answered (Supabase-managed backups), so there is nothing left to remind.
  workflow_dispatch:

# MR-41 B1 -- `set -o pipefail`, as a mechanism rather than a reminder.
#
# GitHub's default for `run:` is `bash -e {0}`, which has NO pipefail: in `a | b`, the step's
# exit status is `b`'s, so a failing `a` is invisible. `shell: bash` is
# `bash --noprofile --norc -eo pipefail {0}`, which is the same shell WITH it.
#
# This is not hypothetical here. `ci.yml` pipes `git diff | awk` to compute the count the
# append-only guard fails on, and `backup.yml` pipes `ls | head -1` to choose the artefact it
# verifies. A guard whose input command failed silently reports the empty answer as the safe
# one -- the `0 deletions` case and the `no artefact` case both look like success.
#
# It has cost two sessions already, on gradle and then on supabase, and the second was hit by
# the person who had written the entry about the first.
defaults:
  run:
    shell: bash

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    name: produce a restorable artefact, and prove it restores
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # FIRST, before anything is produced. Since BE-C80 there is no expiry state: no destination is a
      # green notice, never red.
      - name: Is there a destination for this artefact?
        id: destination
        env:
          BACKUP_DESTINATION: ${{ secrets.BACKUP_DESTINATION }}
        run: |
          if [ -n "$BACKUP_DESTINATION" ]; then
            echo "Destination configured."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::notice title=Not the production backup route (BE-C80)::Production is backed up by Supabase's managed backups (Q-19, 10 October); deploy step 0.1 checks for a completed one from today. This job makes an off-platform copy only when a destination exists AND a step stores it there (BE-W143). Nothing was produced."
          echo "proceed=false" >> "$GITHUB_OUTPUT"
          {
            echo "## Database backup — not the production backup route"
            echo ""
            echo "This run did nothing **on purpose**, and it is not a failure."
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Production backup | **Supabase managed (scheduled) backups** — Q-19, \`BE-C80\` |"
            echo "| Deploy step 0.1 | a completed Supabase backup dated today — \`docs/DEPLOY-RUNBOOK.md\` |"
            echo "| This job | an optional off-platform copy; needs a destination AND a step that stores it (BE-W143) |"
            echo ""
            echo "Nothing was produced. The destination check runs before the dump precisely so"
            echo "that a run with nowhere to put the data leaves no copy of it anywhere."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: pnpm/action-setup@v4
        if: steps.destination.outputs.proceed == 'true'

      - uses: actions/setup-node@v5
        if: steps.destination.outputs.proceed == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.destination.outputs.proceed == 'true'

      # `pg_dump` and `psql` are not on the runner by default, and the backup must not be
      # taken with a client older than the server.
      - name: Install the Postgres client
        if: steps.destination.outputs.proceed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Produce the artefact
        if: steps.destination.outputs.proceed == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          pnpm --filter @fieldforce/api backup:database \
            --db-url "$SUPABASE_DB_URL" --out "$RUNNER_TEMP/backups"

      # Producing is not proving. MR-32's first drill exited 0 having restored nothing.
      - name: Prove it by restoring from it
        if: steps.destination.outputs.proceed == 'true'
        env:
          PGPASSWORD: postgres
        run: |
          sudo systemctl start postgresql || sudo service postgresql start
          ARTEFACT=$(ls "$RUNNER_TEMP"/backups/*.sql | head -1)
          pnpm --filter @fieldforce/api backup:verify \
            --artefact "$ARTEFACT" \
            --db-url "postgresql://postgres:postgres@127.0.0.1:5432/postgres"
